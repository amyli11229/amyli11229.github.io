backend:
  name: git-gateway

local_backend: true

media_folder: images/projects
public_folder: /images/projects

site_url: https://amyli11229.github.io
display_url: https://amyli11229.github.io

collections:
  - name: site
    label: Site-wide
    files:
      - label: Contact links & email
        name: site
        file: _data/site.json
        fields:
          - { label: Your name (nav logo), name: name, widget: string }
          - { label: Email address, name: email, widget: string }
          - { label: LinkedIn URL, name: linkedin, widget: string }
          - { label: GitHub URL, name: github, widget: string }
          - { label: Contact form link, name: contact_form_url, widget: string, hint: "Full Google Form URL (opens in new tab)" }
          - { label: Contact form embed URL, name: contact_form_embed, widget: string, hint: "Google Form embed URL (used in iframe)" }

      - label: Bio (Homepage & About page)
        name: bio
        file: content/pages/bio.md
        fields:
          - label: Intro line
            name: lead
            widget: text
            hint: "Large text at the top. Use **bold** for emphasis, e.g. **AMY LI**"
          - label: Bio paragraph
            name: intro
            widget: text
            hint: "Second paragraph. Use **bold**, **UI/UX**, and [link text](https://example.com)"
          - label: Work experience (About page)
            name: experience
            widget: list
            required: false
            summary: "{{role}} — {{org}}"
            fields:
              - { label: Role, name: role, widget: string }
              - { label: Organization, name: org, widget: string }
              - { label: Location, name: location, widget: string, required: false }
              - { label: Dates, name: dates, widget: string }
              - label: Highlights
                name: highlights
                widget: list
                required: false
                field: { label: Highlight, name: highlight, widget: string }

      - label: Contact page text
        name: contact
        file: content/pages/contact.md
        fields:
          - { label: Page title, name: title, widget: hidden, default: Contact }
          - { label: Layout, name: layout, widget: hidden, default: layouts/contact.njk }
          - { label: Permalink, name: permalink, widget: hidden, default: contact.html }
          - { label: Active nav, name: activePage, widget: hidden, default: contact }
          - { label: Asset root, name: assetRoot, widget: hidden, default: "" }
          - { label: Heading, name: heading, widget: string }
          - { label: Subheading, name: lead, widget: string }
          - { label: Form section title, name: form_heading, widget: string }
          - { label: Form section description, name: form_desc, widget: text }

  - name: projects
    label: Projects
    folder: content/projects
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    identifier_field: title
    summary: "{{title}} (order {{sort_order}})"
    sortable_fields: [sort_order, title]
    filter: { field: layout, value: layouts/project-detail.njk }
    fields:
      - { label: Published (show on site), name: published, widget: boolean, default: true }
      - { label: Sort order (1 = first), name: sort_order, widget: number, value_type: int }

      - { label: Project title, name: title, widget: string }
      - { label: Organization / course line, name: organization, widget: string, hint: "Small line under the title on the project page" }
      - { label: Tools (project page), name: tags, widget: string, hint: "Comma-separated, e.g. Figma, Unreal Engine 5" }
      - { label: Opening paragraph, name: lead, widget: text, hint: "First paragraph on the full project page" }
      - { label: Cover image, name: hero_image, widget: image, choose_url: true }

      - { label: Card badge (e.g. EML, Game Jam), name: card_year, widget: string }
      - { label: Card description, name: card_description, widget: text, hint: "Short blurb on the Projects list / homepage card" }
      - { label: Card subtitle, name: card_medium, widget: string, required: false }
      - { label: Card tools (optional), name: card_tags, widget: string, required: false, hint: "Leave blank to reuse Tools above" }
      - { label: Homepage title (optional), name: card_title_home, widget: string, required: false, hint: "Only if homepage card title should differ" }
      - { label: Homepage description (optional), name: card_description_home, widget: text, required: false, hint: "Only if homepage blurb should differ" }
      - { label: Homepage subtitle (optional), name: card_medium_home, widget: string, required: false, hint: "Only if homepage subtitle should differ" }

      - label: YouTube video (optional)
        name: project_video
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Video title, name: title, widget: string, required: false }
          - { label: YouTube video ID, name: youtube_id, widget: string, hint: "From youtube.com/watch?v=VIDEO_ID" }

      - label: Download / Visit button (optional)
        name: prototype_callout
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Section title, name: title, widget: string }
          - { label: Short text, name: text, widget: text, required: false }
          - { label: Inline link label, name: link_label, widget: string, required: false }
          - { label: Inline link URL, name: link_url, widget: string, required: false }
          - { label: Button label, name: button_label, widget: string, required: false }
          - { label: Button URL, name: button_url, widget: string, required: false }

      - label: Role & Contributions / My Approach
        name: contributions
        widget: list
        required: false
        hint: "Work Projects show as Role & Contributions; all others as My Approach"
        field: { label: Item, name: contribution, widget: string }

      - label: Extra links (optional)
        name: external_links
        widget: list
        required: false
        summary: "{{label}}"
        fields:
          - { label: Link text, name: label, widget: string }
          - { label: URL, name: url, widget: string }

      - { label: Main story (extra paragraphs), name: body, widget: markdown }

      - { label: URL slug, name: slug, widget: string, hint: "Lowercase with hyphens → projects/your-slug.html (rarely change)" }
      - { label: Layout, name: layout, widget: hidden, default: layouts/project-detail.njk }
